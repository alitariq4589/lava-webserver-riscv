# Orange Pi RV2: memory-debug kernel (KASAN/KFENCE/kmemleak/lockdep) on NFS root.
#
# Kernel: /srv/lava/rv2/Image-debug — built with `DEBUG=1 rv2-build-and-send-lava.sh`.
# Everything else is the kselftest job's setup. KASAN/lockdep splats are caught
# two ways: LAVA's own console watching during boot, and the dmesg-clean test
# case after the exercising. Leaks need an explicit kmemleak scan — last steps.
# The PCIe remove/rescan loop exercises the teardown/probe paths where driver
# leaks usually live; swap the device or add bind/unbind loops for whatever
# driver is under test.
#
# The last test (pcie-pm) runs 21 suspend/resume cycles with pm_test, reads
# from the NVMe after each one, and checks the K1 PCIe noirq callbacks when
# the kernel has them. It runs last so a hang cannot cost the results above.
#
# KASAN roughly doubles memory use and slows everything 2-4x — hence the
# longer timeouts and the bigger TFTP transfer.

device_type: orangepi-rv2
job_name: orangepi-rv2 memory debug (KASAN + kmemleak, nfs root)
priority: medium
visibility: public

timeouts:
  job:
    minutes: 150
  action:
    minutes: 30
  connection:
    minutes: 10

actions:
- deploy:
    timeout:
      minutes: 20
    to: tftp
    os: debian
    kernel:
      url: https://github.com/alitariq4589/lava-webserver-riscv/releases/download/rv2-debug/Image-debug
      type: image
    dtb:
      url: https://github.com/alitariq4589/lava-webserver-riscv/releases/download/rv2-debug/k1-orangepi-rv2.dtb
    ramdisk:
      url: file:///srv/lava/rv2/trixie-kselftest.initrd.cpio.gz
      compression: gz
    nfsrootfs:
      url: file:///srv/lava/rv2/trixie-kselftest.rootfs.tar.xz
      compression: xz
    modules:
      url: https://github.com/alitariq4589/lava-webserver-riscv/releases/download/rv2-debug/kselftest.tar.xz
      compression: xz

- boot:
    timeout:
      minutes: 20
    method: u-boot
    commands: nfs
    auto_login:
      login_prompt: 'login:'
      username: root
    prompts:
    - '/ # '
    - 'root@(.*):[/~]#'

- test:
    timeout:
      minutes: 45
    definitions:
    - repository: https://github.com/Linaro/test-definitions
      from: git
      path: automated/linux/kselftest/kselftest.yaml
      name: kselftest
      params:
        SKIP_INSTALL: "true"
        KSELFTEST_PATH: /opt/kselftest
        TST_CMDFILES: "size dt exec"
        SKIPFILE: "none"

- test:
    timeout:
      minutes: 20
    definitions:
    - from: inline
      name: memcheck
      path: inline/memcheck.yaml
      repository:
        metadata:
          format: Lava-Test Test Definition 1.0
          name: memcheck
          description: "KASAN sanity, PCIe remove/rescan exercise, dmesg splat check, kmemleak scan"
          os:
          - debian
          scope:
          - functional
        run:
          steps:
          # Prove we are actually on the debug kernel, not a stale Image-debug.
          - lava-test-case kasan-active --shell 'dmesg | grep -q KernelAddressSanitizer'
          - lava-test-case kmemleak-present --shell 'test -e /sys/kernel/debug/kmemleak'
          # Exercise teardown/probe paths: remove and rescan the NVMe endpoint
          # 20 times. Root is on NFS, so the NVMe is safe to yank.
          - if [ -e /sys/bus/pci/devices/0001:01:00.0 ]; then for i in $(seq 1 20); do echo 1 > /sys/bus/pci/devices/0001:01:00.0/remove; sleep 1; echo 1 > /sys/bus/pci/rescan; sleep 2; done; fi
          - lava-test-case pci-rescan-survived --shell 'test -e /sys/bus/pci/devices/0001:01:00.0'
          # DEMO kernels only (LKDTM built in): trigger a real use-after-free so
          # KASAN fires on the console; silently skipped on normal debug kernels.
          - if [ -e /sys/kernel/debug/provoke-crash/DIRECT ]; then cat /sys/kernel/debug/provoke-crash/DIRECT; echo READ_AFTER_FREE > /sys/kernel/debug/provoke-crash/DIRECT || true; fi
          # Any KASAN/UBSAN/lockdep/sleep-in-atomic report fails this case.
          - dmesg | grep -E -B2 -A25 'BUG:|KASAN|UBSAN:|possible circular locking|possible recursive locking|inconsistent lock state' || true
          - lava-test-case dmesg-clean --shell '! dmesg | grep -qE "BUG:|KASAN|UBSAN:|possible circular locking|possible recursive locking|inconsistent lock state"'
          # kmemleak needs explicit scans; first pass has transient false
          # positives, so scan, settle, scan again, then read.
          - echo scan > /sys/kernel/debug/kmemleak
          - sleep 30
          - echo scan > /sys/kernel/debug/kmemleak
          - sleep 5
          - cat /sys/kernel/debug/kmemleak
          - lava-test-case kmemleak-clean --shell '! grep -q . /sys/kernel/debug/kmemleak'

- test:
    timeout:
      minutes: 20
    definitions:
    - from: inline
      name: pcie-pm
      path: inline/pcie-pm.yaml
      repository:
        metadata:
          format: Lava-Test Test Definition 1.0
          name: pcie-pm
          description: "Suspend/resume cycles with pm_test, NVMe reads after every resume, K1 PCIe noirq callback checks"
          os:
          - debian
          scope:
          - functional
        run:
          steps:
          # pm_test=platform runs every suspend and resume callback, the noirq
          # ones included, then wakes the board by itself after 5 s, so no
          # wake source is needed. Without CONFIG_PM_DEBUG there is no pm_test
          # and the board would really sleep and never wake, so the cycles
          # only run when pm_test exists.
          - lava-test-case pm-test-ready --shell 'test -w /sys/power/pm_test'
          - |
            if [ -w /sys/power/pm_test ]; then
              nvme=/sys/bus/pci/devices/0001:01:00.0
              blk=$(ls /dev/nvme*n1 2>/dev/null | head -n 1)
              if grep -qw k1_pcie_suspend_noirq /proc/kallsyms; then k1=yes; else k1=no; fi
              errors='BUG:|KASAN|UBSAN:|WARNING:|possible circular locking|possible recursive locking|inconsistent lock state|failed to (suspend|resume)|Timeout waiting for L2|Host init failed|Link failed to come up|nvme.*(timeout|controller is down|Removing|aborting)'
              bad=0
              # One cycle: a marker in the kernel log, suspend and resume, a
              # 16 MiB direct read from the SSD, then this cycle's log lines.
              cycle() {
                echo "pmtest-$mark" > /dev/kmsg
                echo freeze > /sys/power/state || bad=1
                sleep 2
                if [ -n "$blk" ]; then
                  dd if="$blk" of=/dev/null bs=1M count=16 skip=$skip iflag=direct status=none || bad=1
                fi
                dmesg | sed -n "/pmtest-$mark\$/,\$p" > /tmp/pm-cycle.log
                grep -E 'spacemit-k1-pcie|nvme' /tmp/pm-cycle.log || true
                if grep -E "$errors" /tmp/pm-cycle.log; then bad=1; fi
              }
              cat /sys/power/state || true
              echo N > /sys/module/printk/parameters/console_suspend || true
              echo platform > /sys/power/pm_test
              # Cycle 0 logs every PM callback with its return value.
              echo 1 > /sys/power/pm_print_times
              mark=c0; skip=0; cycle
              echo 0 > /sys/power/pm_print_times
              dmesg | grep -E 'k1_pcie_(suspend|resume)_noirq returned' || true
              if [ $k1 = no ]; then lava-test-case k1-pm-callbacks --result skip
              elif dmesg | grep -q 'k1_pcie_resume_noirq returned 0'; then lava-test-case k1-pm-callbacks --result pass
              else lava-test-case k1-pm-callbacks --result fail; fi
              # Round 1 keeps ASPM as booted. Round 2 turns ASPM off on the NVMe
              # link, so the NVMe goes to D3 and its port (ca400000.pcie) takes
              # the full path: PME_Turn_Off, L2, deinit, init, a new link-up.
              for round in 1 2; do
                if [ $round = 2 ]; then
                  grep . $nvme/link/* 2>/dev/null || true
                  for f in $nvme/link/*aspm; do
                    if [ -e "$f" ]; then echo 0 > "$f" || true; fi
                  done
                fi
                relinks=0
                for i in $(seq 1 10); do
                  mark=r$round-c$i; skip=$((i * 16)); cycle
                  if grep -q 'ca400000.pcie: PCIe Gen' /tmp/pm-cycle.log; then relinks=$((relinks + 1)); fi
                done
                echo "round $round: the NVMe port retrained its link in $relinks of 10 cycles"
              done
              echo none > /sys/power/pm_test
              if [ $bad = 0 ]; then lava-test-case suspend-resume-cycles --result pass
              else lava-test-case suspend-resume-cycles --result fail; fi
              if [ $k1 = no ]; then lava-test-case nvme-port-relinked --result skip
              elif [ $relinks = 10 ]; then lava-test-case nvme-port-relinked --result pass
              else lava-test-case nvme-port-relinked --result fail; fi
            fi
          # Leaks left behind by the resume paths (memcheck scanned before them).
          - echo scan > /sys/kernel/debug/kmemleak
          - sleep 30
          - echo scan > /sys/kernel/debug/kmemleak
          - sleep 5
          - cat /sys/kernel/debug/kmemleak
          - lava-test-case kmemleak-clean-after-pm --shell '! grep -q . /sys/kernel/debug/kmemleak'
